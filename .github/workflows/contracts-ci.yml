name: Contracts CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Contracts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Cargo registry & build artefacts
      uses: Swatinem/rust-cache@v2

    - name: Build contracts (debug)
      run: cargo build --verbose

    - name: Build reputation-contract WASM
      run: cargo build -p reputation-contract --target wasm32-unknown-unknown --release

    - name: Build adapter-trustless-contract WASM
      run: cargo build -p adapter-trustless-contract --target wasm32-unknown-unknown --release

  test:
    name: Test Contracts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust (stable)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry & build artefacts
      uses: Swatinem/rust-cache@v2

    - name: Run unit tests (all workspace members)
      run: cargo test --verbose

    - name: Run integration tests
      run: cargo test -p integration-tests --verbose
